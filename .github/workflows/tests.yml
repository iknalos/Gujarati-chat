name: tests

on:
  push:
    branches: [main, "**"]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps only
        run: |
          python -m pip install --upgrade pip
          # Just what the pure-Python tests need; we deliberately don't pull
          # torch / transformers / realtimestt / realtimetts on CI.
          pip install pytest numpy
      - name: Run unit tests
        run: pytest tests/ -v
